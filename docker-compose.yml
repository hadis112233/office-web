services:
  office:
    build: .
    container_name: office-web
    ports:
      - "8080:80"
    volumes:
      - ./data:/var/www/html/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "$$r=@json_decode(@file_get_contents('http://127.0.0.1/api/health.php'),true); exit(($$r['ok']??false)?0:1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      - TZ=Asia/Shanghai
