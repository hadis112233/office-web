name: Build and Publish Docker Image

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: office-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Syntax and project checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './data/*' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript and project links
        run: node scripts/check-project.mjs

  docker-check:
    name: Docker build and runtime check
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          pull: true
          tags: office-web:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Start container and verify health and media processing
        run: |
          docker run --detach --name office-web-smoke --publish 127.0.0.1:8080:80 office-web:smoke
          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/health.php | grep --quiet '"ok":true'; then
              echo "Container health endpoint is ready"
              healthy=true
              break
            fi
            sleep 1
          done
          if [ "$healthy" != "true" ]; then
            docker logs office-web-smoke
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:8080/tools/pdf-organize.php \
            | grep --quiet 'PDF 页面整理'
          curl --fail --silent --show-error http://127.0.0.1:8080/tools/pdf-page-numbers.php \
            | grep --quiet 'PDF 添加页码'
          curl --fail --silent --show-error http://127.0.0.1:8080/tools/pdf-metadata.php \
            | grep --quiet 'PDF 文档属性'
          curl --fail --silent --show-error http://127.0.0.1:8080/tools/pdf-to-text.php \
            | grep --quiet 'PDF 提取文字'

          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' \
            | base64 --decode > idcard-smoke.png
          upload_session=0123456789abcdef0123456789abcdef
          upload_response=$(curl --fail-with-body --silent --show-error \
            --form "file=@idcard-smoke.png;type=image/png" \
            --form "type=front" --form "session=$upload_session" \
            http://127.0.0.1:8080/api/upload.php?action=upload)
          echo "$upload_response"
          upload_filename=$(echo "$upload_response" | jq --raw-output '.filename')
          test -n "$upload_filename" -a "$upload_filename" != "null"
          curl --fail --silent --show-error \
            "http://127.0.0.1:8080/api/upload.php?action=get&session=$upload_session&filename=$upload_filename" \
            --output idcard-downloaded.png
          cmp idcard-smoke.png idcard-downloaded.png
          curl --fail-with-body --silent --show-error \
            --form "session=$upload_session" --form "filename=$upload_filename" \
            http://127.0.0.1:8080/api/upload.php?action=delete \
            | grep --quiet '"ok":true'

          docker exec office-web-smoke ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc=size=320x240:rate=10 -t 1 \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart /tmp/media-smoke.mp4
          docker cp office-web-smoke:/tmp/media-smoke.mp4 ./media-smoke.mp4
          media_response=$(curl --fail-with-body --silent --show-error \
            --form "video=@media-smoke.mp4;type=video/mp4" \
            --form "mode=compress" --form "quality=small" \
            http://127.0.0.1:8080/api/media.php?action=process)
          echo "$media_response"
          echo "$media_response" | grep --quiet '"ok":true'

      - name: Stop smoke-test container
        if: always()
        run: docker rm --force office-web-smoke || true

  build:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/office-web:latest
            ghcr.io/${{ github.repository }}:latest
